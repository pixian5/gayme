# 自有服务器自动部署：push main → 测试通过 → tar over SSH 同步到 oh.sbbz.tech（nginx 8080）
name: Deploy Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 测试
        run: |
          npm test
          npm run test:syntax

      - name: 部署到 oh.sbbz.tech
        env:
          SSH_KEY: ${{ secrets.OH_DEPLOY_KEY }}
          HOST: 18.191.80.90
          PORT: 2424
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$SSH_KEY" > ~/deploy_key
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts 2>/dev/null
          tar czf - index.html css js fonts favicon.svg .nojekyll manifest.webmanifest sw.js assets icons \
            | ssh -i ~/deploy_key -p $PORT "ubuntu@$HOST" "tar xzf - -C /var/www/sakura/"

      - name: 验证版本
        run: |
          sleep 2
          LOCAL=$(cat VERSION)
          REMOTE=$(curl -s --connect-timeout 10 https://oh.sbbz.tech:8080/ | grep -o 'v[0-9.]* · Demo' | head -1)
          echo "本地 v${LOCAL} / 线上 ${REMOTE}"
          [ "${REMOTE}" = "v${LOCAL} · Demo" ]
