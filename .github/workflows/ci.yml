# 持续集成：推送与 PR 时跑全部 Node 原生测试（剧情图 / 时间线 / 存档 / 契约 / 生命周期 / 版本一致性）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行测试
        run: |
          npm test
          npm run test:syntax
