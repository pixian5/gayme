<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>樱时信笺 · Sakura Letters</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="js/saves.js" as="script">
<link rel="preload" href="js/script.js" as="script">
<link rel="preload" href="js/engine.js" as="script">
<meta name="theme-color" content="#241e38">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="樱时信笺">
<meta property="og:type" content="website">
<meta property="og:title" content="樱时信笺 · Sakura Letters">
<meta property="og:description" content="以「写信 / 回信」为核心交互的视觉小说：校园群像 + 时间循环 + 多结局。在樱花开落的季节，写下属于你的回信。">
<meta property="og:image" content="assets/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css?v=3.4.23">
<link rel="stylesheet" href="css/games.css?v=3.4.23">
</head>
<body>
<div id="game" role="application" aria-label="樱时信笺视觉小说">

  <!-- 背景层 -->
  <div id="bg-layer" class="bg-scene scene-school_gate"></div>
  <div id="bg-overlay"></div>

  <!-- 粒子层（樱花/雨/雪） -->
  <canvas id="particles"></canvas>

  <!-- 立绘层 -->
  <div id="char-layer"></div>

  <!-- 顶部菜单条 -->
  <div id="top-bar" aria-label="游戏菜单">
    <button data-menu="inbox" title="消息" aria-label="消息" id="btn-inbox">📩<span id="inbox-badge" class="hidden"></span></button>
    <button data-menu="moments" title="朋友圈" aria-label="朋友圈" id="btn-moments">🌸</button>
    <button data-menu="history" title="历史" aria-label="历史">📜</button>
    <button data-menu="save" title="存档" aria-label="存档">💾</button>
    <button data-menu="load" title="读档" aria-label="读档">📂</button>
    <button data-menu="config" title="设置" aria-label="设置">⚙️</button>
    <button data-menu="keywords" title="关键词" aria-label="关键词">🔑</button>
    <button data-menu="cg" title="CG图鉴" aria-label="CG图鉴">🖼️</button>
    <button data-menu="flowchart" title="流程图" aria-label="流程图">🗺️</button>
    <button data-menu="stats" title="数据统计" aria-label="数据统计">📊</button>
    <button data-menu="title" title="返回标题" aria-label="返回标题">🏠</button>
    <button id="btn-auto" title="自动" aria-label="自动模式">▶▶</button>
    <button id="btn-skip" title="快进" aria-label="快进模式">⏩</button>
    <button id="btn-more" title="更多菜单" aria-label="更多菜单">☰</button>
  </div>

  <!-- 环境线索层 -->
  <div id="clue-layer"></div>

  <!-- 日程条（左上） -->
  <div id="day-bar" aria-live="polite"></div>

  <!-- 好感度心条（右上） -->
  <div id="heart-bar" aria-live="polite"></div>

  <!-- 对话框 -->
  <div id="dialog-box" class="hidden" role="dialog" aria-label="剧情对白">
    <div id="speaker" aria-label="说话者"></div>
    <div id="dialog-text" aria-live="polite" tabindex="0"></div>
    <div id="click-hint" aria-hidden="true">▼</div>
  </div>

  <!-- 选项层 -->
  <div id="choices" class="hidden" role="group" aria-live="polite" aria-label="剧情选项"></div>

  <!-- 标题画面 -->
  <div id="title-screen" class="screen">
    <div class="title-main">
      <h1 class="title-cn">樱时信笺</h1>
      <p class="title-en">Sakura · Letters · in · Cherry · Time</p>
      <p class="title-sub">在樱花开落的季节，写下属于你的回信</p>
    </div>
    <div class="title-menu">
      <button data-action="new">开始新游戏</button>
      <button data-action="continue">继续游戏</button>
      <button data-action="load">读取存档</button>
      <button data-action="gallery">结局图鉴</button>
      <button data-action="cg">CG 图鉴</button>
      <button data-action="keywords">关键词收集</button>
      <button data-action="flowchart">流程图</button>
      <button data-action="stats">数据统计</button>
      <button data-action="trueend" class="hidden">★ 真结局 ★</button>
      <button data-action="afterword" class="hidden">樱海后日谈</button>
      <button data-action="about">关于</button>
    </div>
    <div class="title-version">v3.4.23 · Demo</div>
  </div>

  <!-- 通用菜单浮层（存档/读档/设置/历史/图鉴/CG/关键词/流程图） -->
  <div id="overlay" class="screen hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h2 id="overlay-title">存档</h2>
        <button class="overlay-close" data-close aria-label="关闭浮层" title="关闭">✕</button>
      </div>
      <div id="overlay-body" class="overlay-body" tabindex="-1"></div>
    </div>
  </div>

  <!-- 结局画面 -->
  <div id="ending-screen" class="screen hidden">
    <div class="ending-content">
      <div id="ending-type"></div>
      <h2 id="ending-title"></h2>
      <p id="ending-text"></p>
      <div class="ending-actions">
        <button data-action="title">返回标题</button>
        <button data-action="gallery">结局图鉴</button>
      </div>
    </div>
  </div>

</div>

<script defer src="js/saves.js?v=3.4.23"></script>
<script defer src="js/script.js?v=3.4.23"></script>

<script defer src="js/game-help.js?v=3.4.23"></script>
<script defer src="js/gamekit.js?v=3.4.23"></script>
<script defer src="js/games/afterword.js?v=3.4.23"></script>
<script defer src="js/games/senses.js?v=3.4.23"></script>
<script defer src="js/games/craft.js?v=3.4.23"></script>
<script defer src="js/games/nature.js?v=3.4.23"></script>
<script defer src="js/games/perception.js?v=3.4.23"></script>
<script defer src="js/games/mechanism.js?v=3.4.23"></script>
<script defer src="js/games/imagery.js?v=3.4.23"></script>
<script defer src="js/games/direct.js?v=3.4.23"></script>
<script defer src="js/ui/panels.js?v=3.4.23"></script>
<script defer src="js/engine.js?v=3.4.23"></script>
<script>
// PWA：注册 Service Worker（仅安全上下文：https 或 localhost）
// v3.3.6：补 localhost / 127.0.0.1 / ::1——此前只判 https，导致 e2e（http://localhost）
// 从未覆盖 SW，注释与实际也不一致
const __swSecure = location.protocol === "https:"
  || ["localhost", "127.0.0.1", "[::1]", "::1"].includes(location.hostname);
if ("serviceWorker" in navigator && __swSecure) {
  addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      // v3.4.10：每 5 分钟探新版本；有更新时提示玩家刷新（PWA 获取更新的唯一通道）
      setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
      let hinted = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hinted) return; hinted = true;
        (window.flashHint || ((m) => console.info(m)))("✦ 新版本已就绪，刷新页面生效");
      });
    } catch (e) {}
  });
}
</script>
</body>
</html>
