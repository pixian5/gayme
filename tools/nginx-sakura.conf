# 樱时信笺 · 静态站 nginx 配置片段（v3.4.32 修复用）
# 目标：修复线上实测到的三个问题
#   1) 所有资源 cache-control: no-store → 版本化资源应长缓存
#   2) JS/CSS/HTML 未压缩 → 开启 gzip
#   3) x-content-type-options / referrer-policy 重复 → 只保留一处
#
# 用法：把本文件内容并入 server { ... } 内（InstaBox 上对应
# /data/home/sakura-web/conf.d/*.conf），执行 `nginx -t` 后 reload。
# 注意：只对带 ?v=<VERSION> 的资源做 immutable 长缓存；发版时 bump 版本号即可失效。

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

# 入口与 SW：必须每次回源，保证更新及时到达
location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
location = /sw.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
}
location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}

# 版本化静态资源：一年长缓存 + immutable
location ~* \.(?:js|css|woff2|webp|png|jpg|jpeg|svg|ogg|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
}

# 其余请求按默认处理
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri $uri/ /index.html;
}